<style>
:root {

.wrap { max-width: 1040px; margin: 0 auto; padding: 0 24px; }

.sortbar button:hover, .sortbar button.on, .seg button[aria-pressed="true"] { color: var(--ink); }

.seg { position: relative; display: grid; grid-template-columns: repeat(var(--n), minmax(76px, 1fr)); padding: 3px;

/* search */
.search { position: relative; flex: 1; max-width: 380px; margin: 0 24px; }

.results a + a { border-top: 1px solid var(--line); }

.results small, .results p { color: var(--muted); font-size: 12.5px; }
.results small { display: block; margin-top: 3px; }

/* paper page: spec rows */
.spec { padding: 22px 0; border-bottom: 1px solid var(--line); }

dl { margin: 0; }
.actions { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 30px; }
.btn { font-size: 14px; font-weight: 500; text-decoration: none; padding: 8px 16px; border-radius: 999px;
       border: 1px solid var(--line); background: var(--bg); }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }

@media (max-width: 640px) {

  .row { grid-template-columns: 1fr; } .score { margin-bottom: 14px; } .score .track { width: 92px; }

  a.row:hover { box-shadow: -16px 0 0 var(--hover), 16px 0 0 var(--hover); }
}

<script>
document.getElementById("theme").addEventListener("click", function () {
  var el = document.documentElement, dark = el.dataset.theme ? el.dataset.theme === "dark" : matchMedia("(prefers-color-scheme: dark)").matches;
  el.dataset.theme = dark ? "light" : "dark";
  try { localStorage.setItem("theme", el.dataset.theme); } catch (e) {}
});
(function () {  // sidebar: mark the day currently being read
  var links = document.querySelectorAll('.side a[href^="#d-"]');
  if (!links.length || !window.IntersectionObserver) return;
  var io = new IntersectionObserver(function (es) {
    es.forEach(function (e) {
      if (!e.isIntersecting) return;
      links.forEach(function (l) { l.classList.toggle("on", l.getAttribute("href") === "#" + e.target.id); });
    });
  }, {rootMargin: "0px 0px -75% 0px"});
  links.forEach(function (l) { var d = document.getElementById(l.getAttribute("href").slice(1)); if (d) io.observe(d); });
})();
(function () {  // sort bar: flip the day order, or swap the feed for a pre-rendered top list
  var bar = document.querySelector(".sortbar"), feed = document.getElementById("feed"), top = document.getElementById("top");
  if (!bar || !feed || !top) return;
  var range = document.getElementById("range"), order = "new", key = "sort:" + location.pathname;
  var more = document.getElementById("more"), page = +feed.dataset.page || 100, limit = page;
  function paginate() {  // show days, in their current order, until `limit` papers are on screen
    var n = 0, left = 0;
    [].forEach.call(feed.querySelectorAll(".dayblock"), function (d) {
      var c = d.querySelectorAll(".row").length;
      d.hidden = n >= limit; if (d.hidden) left += c; n += c;
    });
    [].forEach.call(feed.querySelectorAll(".monthblock"), function (m) { m.hidden = !m.querySelector(".dayblock:not([hidden])"); });
    if (more) { more.hidden = feed.hidden || !left; more.querySelector("span").textContent = left + " more"; }
  }
  function reveal(hash) {  // a jump link to a day that is not loaded yet
    var t = document.getElementById(hash.slice(1)), blk = t && t.closest(".dayblock");
    if (!blk || !blk.hidden) return false;
    while (blk.hidden) { limit += page; paginate(); }
    return true;
  }
  if (more) more.addEventListener("click", function () { limit += page; paginate(); });
  var topMore = document.getElementById("topmore");
  function topPage(add) {  // the open top list shows 10 papers, then 10 more per click
    var s = top.querySelector("section:not([hidden])");
    if (!s || !topMore) return;
    var rows = s.querySelectorAll(".row"), lim = (+s.dataset.limit || 10) + (add || 0);
    s.dataset.limit = lim;
    [].forEach.call(rows, function (r, i) { r.hidden = i >= lim; });
    s.querySelector(".n").textContent = Math.min(lim, rows.length);
    topMore.hidden = rows.length <= lim;
    topMore.querySelector("span").textContent = Math.max(rows.length - lim, 0) + " more";
  }
  if (topMore) topMore.addEventListener("click", function () { topPage(10); });
  function flip(el) {  // headings are not sections, so a month's title stays on top
    [].slice.call(el.children).filter(function (k) { return k.tagName === "SECTION"; }).reverse()
      .forEach(function (k) { el.appendChild(k); });
  }
  function press(group, on) {
    [].forEach.call(group.querySelectorAll("button"), function (b) {
      b.classList.toggle("on", b === on); b.setAttribute("aria-pressed", b === on);
    });
  }
  function show(sort, win) {
    var isTop = sort === "top";
    if (!isTop && sort !== order) { order = sort; limit = page; flip(feed); [].forEach.call(feed.querySelectorAll(".monthblock"), flip); }
    feed.hidden = isTop; top.hidden = range.hidden = !isTop;
    paginate();
    press(bar.querySelector(".sorts"), bar.querySelector('[data-sort="' + sort + '"]'));
    var btn = win && range.querySelector('[data-range="' + win + '"]');
    if (btn) {
      press(range, btn);
      range.style.setProperty("--i", [].indexOf.call(range.querySelectorAll("button"), btn));
      [].forEach.call(top.children, function (s) { s.hidden = s.dataset.range !== win; });
    }
    topPage();
    try { sessionStorage.setItem(key, sort + " " + range.querySelector(".on").dataset.range); } catch (e) {}
  }
  bar.addEventListener("click", function (e) {
    var b = e.target.closest("button");
    if (b) show(b.dataset.sort || "top", b.dataset.range);
  });
  // a jump link needs the days back on screen
  window.addEventListener("hashchange", function () {
    if (!/^#[dm]-/.test(location.hash)) return;
    var was = feed.hidden; if (was) show(order);
    if (reveal(location.hash) || was) location.replace(location.hash);
  });
  var saved = [];
  try { saved = (sessionStorage.getItem(key) || "").split(" "); } catch (e) {}
  if (saved[0] === "top" && /^#[dm]-/.test(location.hash)) saved[0] = "new";
  if (bar.querySelector('[data-sort="' + saved[0] + '"]')) show(saved[0], saved[1]);
  paginate();
  if (/^#d-/.test(location.hash) && reveal(location.hash)) document.getElementById(location.hash.slice(1)).scrollIntoView();
})();

<script>
(function () {
  var root ="../", q = document.getElementById("q"), box = document.getElementById("results"), on = -1;
  function load() {  // the index is only fetched once someone actually searches
    if (window.PAPERS || load.started) return;
    load.started = true;
    var s = document.createElement("script");
    s.src = root + "search.js"; s.onload = run; document.head.appendChild(s);
  }
  function fold(s) {  // lowercase, accents stripped, so "reouven" finds "Réouven"
    return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "");
  }
  function run() {
    var words = fold(q.value).split(/\s+/).filter(Boolean);
    box.textContent = ""; on = -1;
    if (!words.length || !window.PAPERS) { box.hidden = true; return; }
    function has(hay) { return words.every(function (w) { return hay.indexOf(w) >= 0; }); }
    var hits = window.PAPERS.filter(function (p) {
      if (!p.h) { p.fa = fold(p.a); p.h = fold(p.t + " " + p.id + " " + p.x) + " " + p.fa; }
      return has(p.h);
    }).sort(function (a, b) { return has(b.fa) - has(a.fa) || b.s - a.s; }).slice(0, 8);  // author matches first
    hits.forEach(function (p) {
      var a = document.createElement("a"), by = document.createElement("small"), m = document.createElement("small");
      a.href = root + p.id + "/index.html"; a.textContent = p.t;
      // name the authors the query matched, else the first few
      var names = p.a.split(", "), match = names.filter(function (n) {
        var f = fold(n); return words.some(function (w) { return f.indexOf(w) >= 0; });
      });
      var shown = (match.length ? match : names).slice(0, 3);
      by.textContent = shown.join(", ") + (shown.length < names.length ? (match.length ? ", and others" : ", et al.") : "");
      m.textContent = p.s.toFixed(1) + "%  ·  " + p.d + "  ·  " + p.id;
      a.appendChild(by); a.appendChild(m); box.appendChild(a);
    });
    if (!hits.length) { var e = document.createElement("p"); e.textContent = "No matches."; box.appendChild(e); }
    box.hidden = false;
  }
  q.addEventListener("focus", function () { load(); run(); });
  q.addEventListener("input", run);
  q.addEventListener("keydown", function (e) {
    var links = box.querySelectorAll("a");
    if (e.key === "Escape") { q.blur(); box.hidden = true; }
    else if (e.key === "Enter" && links.length) { location.href = links[Math.max(on, 0)].href; }
    else if (e.key === "ArrowDown" || e.key === "ArrowUp") {
      e.preventDefault();
      if (!links.length) return;
      on = (on + (e.key === "ArrowDown" ? 1 : -1) + links.length) % links.length;
      links.forEach(function (l, i) { l.classList.toggle("on", i === on); });
    }
  });
  document.addEventListener("click", function (e) { if (!e.target.closest(".search")) box.hidden = true; });
  document.addEventListener("keydown", function (e) {
    if (e.key === "/" && document.activeElement !== q) { e.preventDefault(); q.focus(); }
  });
})();
</script>
