# Displayed score = sigmoid(score_sharpen * logit(raw)). 1.0 = raw. Higher lifts strong papers
# toward 100% (raw 95 -> 97.0, 90 -> 93.0, 80 -> 83.7 at 1.18); 50% never moves and the ranking
# never changes. Above ~1.9 everything good lands on 99%. Retrain after changing.
score_sharpen: 1.18

background:
  n_days: 4             # random past windows sampled for "not liked" background papers
  window_days: 10
  max_papers: 2500
  months_back: 18

email:
  # The mailing list is NOT here (this repo is public): it is EMAIL_RECIPIENTS in .env locally
  # and a GitHub Actions secret of the same name. Comma-separated; each address gets its own copy.
  style: plain          # "plain" (bold titles, no other formatting) or "styled" (site look, serif)
  max_papers: 10
  min_score: 0.50       # never email anything below this, even on a slow day

site:
  min_score: 0.80
  page_size: 100        # papers shown on the index before the "Load more" button
  base_url: "https://elizabethkunz.github.io/arxiv-updater"
  title: "arXiv updates"

run:
  lookback_days: 5      # daily run scans this window and skips already-seen IDs

summarizer:
  model: "claude-haiku-4-5"
  max_chars: 400000     # papers longer than this fall back to the abstract (logged)
