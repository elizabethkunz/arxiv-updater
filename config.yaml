# arXiv digest configuration (no secrets here — those go in .env)

liked_csv: "Interesting papers - Sheet1.csv"
disliked_csv: "disliked.csv"        # optional, same columns; used as hard negatives if present

# arXiv categories to watch (one OAI-PMH query each; cross-lists are deduped).
categories:
  - quant-ph
  - cond-mat.supr-con
  - cond-mat.mes-hall
  - cond-mat.quant-gas
  - physics.atom-ph

embedding_model: "BAAI/bge-base-en-v1.5"

# Author features (see digest/authors.py). Text embedding has weight 1; these scale the author
# block against it. 0 turns a part off. Retrain after changing anything here.
authors:
  weight: 0.3               # authors learned from the liked list
  established_weight: 0.1   # one flag: "has an author from the list below"
  established:
